<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FitApp · Referência visual</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/energy.css"><style>body{padding:24px}.reference-heading{max-width:1160px;margin:0 auto 24px}.reference-heading p{margin:12px 0}.reference-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:1160px;margin:auto}.reference-grid iframe{width:100%;height:1100px;border:1px solid var(--line);border-radius:20px}.sample{max-width:520px;margin:auto}.sample>.panel{margin-top:24px}.swatches{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.swatches span{padding:12px;border:1px solid var(--control-line);border-radius:12px;font-size:12px}.reference-heading label{display:inline-flex;gap:12px;align-items:center}.sample .quick-workout{margin:24px 0}.sample .summary-illustration{margin:auto}.sample .stack{margin-top:16px}@media(max-width:800px){.reference-grid{grid-template-columns:1fr}body{padding:16px}}</style></head><body><div id="reference"></div><script>
const params=new URLSearchParams(location.search),root=document.getElementById('reference');
if(params.has('sample')){
 document.documentElement.dataset.theme=params.get('theme')==='dark'?'dark':'light';
 document.documentElement.dataset.effects='reduced';
 root.innerHTML=`<main class="sample"><span class="eyebrow">FITAPP · ${params.get('theme')==='dark'?'ESCURO':'CLARO'}</span><h1>Energia para continuar.</h1><p>Referência visual · dados ilustrativos</p><div class="swatches"><span style="background:var(--surface)">Superfície</span><span style="background:var(--action);color:var(--on-action)">Ciano</span><span style="background:var(--secondary-soft);color:var(--secondary)">Violeta</span></div><section class="quick-workout panel"><img class="quick-illustration" src="illustrations/preparation.svg" width="80" height="60" alt=""><span class="eyebrow">PRÓXIMO TREINO</span><h2>Próximo treino: B</h2><p>Minha ficha · 6 exercícios</p><button class="button primary">Começar treino →</button><details><summary>Trocar dia ou ficha</summary><p>Exemplo de opções sob demanda.</p></details></section><section class="panel"><span class="eyebrow">SESSÃO EM FOCO</span><h2>Seu treino. Seu ritmo.</h2><div class="workout-hud" style="position:static;margin-top:16px"><span class="eyebrow">TEMPO DE SESSÃO</span><strong style="font-size:32px;font-variant-numeric:tabular-nums">00:18:42</strong><div class="progress-bar-container"><div class="progress-bar" style="width:50%"></div></div></div><label class="field">Carga em kg<input type="number" value="12"></label><label class="field">Repetições<input type="number" value="10"></label><div class="stack"><button class="button secondary">Ajustar exercício</button><button class="button primary" disabled>Salvando…</button></div></section><section class="panel" style="text-align:center"><img class="summary-illustration" src="illustrations/celebration.svg" width="180" height="135" alt=""><span class="eyebrow">UM PASSO A MAIS</span><h2>Treino registrado.</h2><p>Dados ilustrativos para avaliar a composição.</p><div class="stack"><button class="button primary">Ver meu registro →</button><button class="button secondary">Compartilhar resumo</button></div></section></main>`;
}else{
 root.innerHTML='<header class="reference-heading"><span class="eyebrow">FITAPP · SISTEMA VISUAL</span><h1>Energia, alegria e foco.</h1><p>Ciano e violeta. Os mesmos componentes nos dois temas, com dados ilustrativos.</p></header><div class="reference-grid"><iframe src="design-reference.html?sample=1&theme=light" title="Referência do tema claro"></iframe><iframe src="design-reference.html?sample=1&theme=dark" title="Referência do tema escuro"></iframe></div>';
 for(const frame of document.querySelectorAll('iframe'))frame.addEventListener('load',async()=>{await frame.contentDocument.fonts.ready;frame.style.height=frame.contentDocument.documentElement.scrollHeight+'px';});
 window.addEventListener('resize',()=>{for(const frame of document.querySelectorAll('iframe'))frame.style.height=frame.contentDocument.documentElement.scrollHeight+'px';});
}
</script></body></html>
