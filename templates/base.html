<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FitApp - Diário de Treinos</title>
    <!-- Chamando o CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <header>
        <h1 class="header-title">💪 FitApp</h1>
        <button class="btn-audio" id="btnAudio">🔊 <span>Áudio Off</span></button>
    </header>

    <div class="container" id="appContainer">
        <!-- O Jinja2 injetará o conteúdo dos outros arquivos exatamente aqui -->
        {% include 'treino.html' %}
        {% include 'album.html' %}
        {% include 'biblioteca.html' %}
    </div>

    <!-- Modal do Pacotinho -->
    <div class="pack-modal" id="packModal">
        <div class="pack-envelope" id="packEnvelope">
            Pacotinho do Dia<br><br>👆 TOQUE PARA RASGAR
        </div>
        <div class="pack-reveal-area" id="packRevealArea"></div>
        <button class="btn-close-modal" id="btnClosePack">Ir para o Álbum</button>
    </div>

    <nav>
        <button id="nav-treino" class="active"><span class="icon">🏋️</span> Treinar</button>
        <button id="nav-calendario"><span class="icon">📖</span> Álbum & Coach</button>
        <button id="nav-biblioteca"><span class="icon">🔍</span> Base</button>
    </nav>

    <div id="toast" class="toast"></div>

    <!-- Chamando o JavaScript -->
    <!-- 1. DADOS PUROS PRIMEIRO -->
    <script src="/static/js/dados.js"></script>
    <!-- 2. MOTOR LÓGICO DEPOIS -->
    <script src="/static/js/app.js"></script>
</body>
</html>
