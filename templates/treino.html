<main id="tab-treino" class="tab-content active">
    <div id="timerContainer" class="timer-container">
        <div id="timerDisplay" class="timer-display">01:00</div>
        <div class="timer-controls">
            <button class="time-btn active" data-time="60">60s</button>
            <button class="time-btn" data-time="90">90s</button>
            <button class="time-btn" data-time="120">120s</button>
        </div>
    </div>
    
    <!-- Painel de Estatísticas -->
    <div class="dashboard-header">
        <div class="stats-panel">
            <div class="stat-box">
                <span id="statTotal" class="stat-value">0</span>
                <span class="stat-label">Treinos Salvos</span>
            </div>
            <div class="stat-box">
                <span id="statLast" class="stat-value">-</span>
                <span class="stat-label">Último Treino</span>
            </div>
        </div>
        <div style="display: flex; gap: 10px;">
            <select id="styleSelector" class="select-level" style="flex: 1;">
                <option value="biset" selected>🔗 Modo Bi-set</option>
                <option value="tradicional">🏋️ Modo Tradicional</option>
            </select>
            <select id="levelSelector" class="select-level" style="flex: 1;">
                <option value="iniciante">🟢 Iniciante</option>
                <option value="intermediario" selected>🟡 Intermediário</option>
                <option value="avancado">🔴 Avançado</option>
            </select>
        </div>
    </div>

    <!-- Cartões de Sequência Lógica -->
    <div class="workout-cards" id="workoutCards">
        <div class="card-treino" id="card-A" onclick="FitApp.startWorkout('A')">
            <h3>Treino A</h3>
            <p>Peito & Tríceps</p>
            <div class="lock-overlay" id="lock-A">🔒</div>
        </div>
        <div class="card-treino" id="card-B" onclick="FitApp.startWorkout('B')">
            <h3>Treino B</h3>
            <p>Costas & Bíceps</p>
            <div class="lock-overlay" id="lock-B">🔒</div>
        </div>
        <div class="card-treino" id="card-C" onclick="FitApp.startWorkout('C')">
            <h3>Treino C</h3>
            <p>Pernas & Ombros</p>
            <div class="lock-overlay" id="lock-C">🔒</div>
        </div>
        <div class="card-treino" id="card-Livre" onclick="FitApp.startWorkout('Livre')" style="border-left-color: #a64dff; margin-top: 10px;">
            <h3>🛠️ Treino Livre</h3>
            <p>Monte seu próprio treino</p>
        </div>
    </div>
    
    <!-- Botão de Override (Discreto) -->
    <div style="text-align: center; margin-bottom: 20px;">
        <button class="btn-text" onclick="FitApp.unlockAll()" style="color: #666; background: none; border: none; text-decoration: underline; cursor: pointer; font-size: 12px;">Desbloquear todos (Override)</button>
    </div>

    <!-- Nova Tela de Preparação (Staging Area) -->
    <div id="workoutPreview" style="display: none; padding: 15px; background: #2a2a2a; border-radius: 8px; margin-bottom: 20px;">
        <div style="text-align: center; margin-bottom: 15px;">
            <h2 id="previewTitle" style="color: #00ff88; margin-bottom: 5px;">Treino Selecionado</h2>
            <p id="previewDesc" style="color: #aaa; margin-bottom: 15px; font-size: 14px;">Revise seu plano e adapte movimentos, se necessário.</p>
        </div>
        
        <!-- Lista de Prévia do Treino -->
        <div id="previewList" style="max-height: 45vh; overflow-y: auto; margin-bottom: 20px; padding-right: 5px; border-top: 1px solid #444; padding-top: 15px;"></div>
        
        <!-- Botão Dinâmico (Só aparece no Treino Livre) -->
        <button id="btnAddExercise" class="btn-action" onclick="FitApp.openAddExerciseModal()" style="background: #111; border: 1px dashed #a64dff; color: #a64dff; margin-bottom: 15px; display: none;">➕ Adicionar Exercício</button>

        <button id="btnStartWorkout" class="btn-action btn-success" onclick="FitApp.beginWorkoutExecution()" style="margin-bottom: 10px;">▶️ Iniciar Treino</button>
        <button class="btn-action" onclick="FitApp.cancelWorkoutPreview()" style="background: #555;">⬅️ Voltar ao Painel</button>
    </div>

    <div id="workoutArea" style="display: none;">
        <!-- Display do Cronômetro Global -->
        <div id="globalTimerDisplay" style="text-align: center; font-size: 28px; font-weight: bold; color: #fff; margin-bottom: 15px; font-family: monospace; letter-spacing: 2px;">00:00:00</div>
        
        <div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div>
        <div id="exerciseList"></div>
    </div>
    
    <div class="btn-finish-area" id="btnFinishArea">
        <button id="btnFinishAction" class="btn-action btn-warning">⚠️ Encerrar Incompleto</button>
    </div>

    <!-- Modal de Inserção de Exercício (Treino Livre) -->
    <div id="addExerciseModal" class="swap-modal-overlay">
        <div class="swap-modal-content" style="max-height: 90vh; display: flex; flex-direction: column;">
            <div class="swap-modal-header">
                <h3>Adicionar Exercício</h3>
                <!-- Injeção do display: block para sobrepor o CSS oculto -->
                <button class="btn-close-modal" onclick="document.getElementById('addExerciseModal').style.display='none'" style="display: block;">&times;</button>
            </div>
            
            <input type="text" id="searchAddInput" placeholder="Buscar exercício..." onkeyup="FitApp.filterAddModal()" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #121212; color: #fff; margin-bottom: 10px;">
            
            <!-- Faixa de Filtros (Chips) Ajustada para quebrar linha (wrap) em telas maiores -->
            <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding-bottom: 5px; margin-bottom: 10px; flex-shrink: 0;">
                <button class="filter-chip" onclick="FitApp.setCategoryFilter('todos', this)" style="background: rgba(166, 77, 255, 0.2); color: #a64dff; border: 1px solid #a64dff; padding: 6px 12px; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer;">Todos</button>
                <button class="filter-chip" onclick="FitApp.setCategoryFilter('peito', this)" style="background: #2a2a2a; color: #aaa; border: 1px solid #444; padding: 6px 12px; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer;">Peito</button>
                <button class="filter-chip" onclick="FitApp.setCategoryFilter('costas', this)" style="background: #2a2a2a; color: #aaa; border: 1px solid #444; padding: 6px 12px; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer;">Costas</button>
                <button class="filter-chip" onclick="FitApp.setCategoryFilter('pernas', this)" style="background: #2a2a2a; color: #aaa; border: 1px solid #444; padding: 6px 12px; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer;">Pernas</button>
                <button class="filter-chip" onclick="FitApp.setCategoryFilter('ombros', this)" style="background: #2a2a2a; color: #aaa; border: 1px solid #444; padding: 6px 12px; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer;">Ombros</button>
                <button class="filter-chip" onclick="FitApp.setCategoryFilter('triceps', this)" style="background: #2a2a2a; color: #aaa; border: 1px solid #444; padding: 6px 12px; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer;">Tríceps</button>
                <button class="filter-chip" onclick="FitApp.setCategoryFilter('biceps', this)" style="background: #2a2a2a; color: #aaa; border: 1px solid #444; padding: 6px 12px; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer;">Bíceps</button>
                <button class="filter-chip" onclick="FitApp.setCategoryFilter('core', this)" style="background: #2a2a2a; color: #aaa; border: 1px solid #444; padding: 6px 12px; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer;">Core</button>
            </div>

            <div id="addExerciseList" class="swap-list" style="flex: 1; overflow-y: auto; margin-bottom: 15px;">
                <!-- Lista injetada via JS -->
            </div>
            
            <div id="addExerciseConfig" style="display: none; background: #2a2a2a; padding: 15px; border-radius: 8px; border-left: 4px solid #a64dff; margin-bottom: 15px;">
                <h4 id="selectedExerciseName" style="color: #fff; margin-bottom: 10px;">Nome do Exercicio</h4>
                <div style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label style="color: #aaa; font-size: 12px;">Séries</label>
                        <input type="number" id="customSets" value="4" style="width: 100%; padding: 8px; background: #111; border: 1px solid #444; color: #fff; border-radius: 4px; text-align: center;">
                    </div>
                    <div style="flex: 1;">
                        <label style="color: #aaa; font-size: 12px;">Repetições</label>
                        <input type="text" id="customReps" value="10-12" style="width: 100%; padding: 8px; background: #111; border: 1px solid #444; color: #fff; border-radius: 4px; text-align: center;">
                    </div>
                </div>
                <button onclick="FitApp.confirmAddExercise()" style="width: 100%; padding: 10px; margin-top: 15px; background: #a64dff; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">✅ Adicionar ao Treino</button>
            </div>
            
            <!-- Novo Botão de Cancelar -->
            <button onclick="document.getElementById('addExerciseModal').style.display='none'" style="width: 100%; padding: 12px; background: #333; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Cancelar</button>
        </div>
    </div>
</main>
